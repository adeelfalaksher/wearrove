name = "wearrove-api"
main = "src/worker.mjs"
compatibility_date = "2026-10-30"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "wearrove"
database_id = "REPLACE_WITH_YOUR_OWN_D1_DATABASE_ID"

[vars]
SITE_ORIGINS = "https://YOUR_SITE.vercel.app"
ASSET_ORIGIN = "https://YOUR_SITE.vercel.app"
YOUCAM_MAX_TASK_UNITS = "2"
YOUCAM_MIN_BALANCE = "20"
YOUCAM_TOTAL_BUDGET = "20"
YOUCAM_DAILY_BUDGET = "10"

[triggers]
crons = ["0 * * * *"]

# Set YOUCAM_API_KEY using the provider's encrypted secret facility.

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = false
